# Held-out set blind-1: written from docs/GRANT_RULES.md, config/grants.yaml, docs/ACCESS.md,
# config/access.yaml and docs/FIXTURE.md only. Every money figure was computed by hand; the arithmetic
# is in the comment next to it. "R(x)" means x rounded to cents, half up.
#
# Grants used unless a case says otherwise:
#   EU grant: eu_daily, DE, funding 0.7, indirect 0.25
#   DE grant: de_hourly, DE, funding 0.5, indirect 0.2

cost_cases:

  # ---------------------------------------------------------------- eu_daily basics and rounding

  - name: EU daily - two entries, rate is annual/215 and hours/8 are days
    grant: { method: eu_daily, entity: DE, funding_rate: 0.7, indirect_rate: 0.25 }
    people: { anna: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 64500, contract_hours: 1720, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-03-10, hours: 6, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-03-11, hours: 7.5, status: approved, late: false }
    period: 2026-03
    expect:
      direct_eur: "506.25"        # rate 64500/215 = 300/day; 13.5h/8 = 1.6875 d; 1.6875*300 = 506.25
      indirect_eur: "126.56"      # 506.25*0.25 = 126.5625 -> 126.56
      funded_eur: "442.97"        # (506.25+126.56)*0.7 = 632.81*0.7 = 442.967 -> 442.97
      ineligible_hours: "0.00"
      contributors: 1
      lines:
        anna: { eligible_hours: "13.50", direct_eur: "506.25", other_entity_hours: "0.00", late_hours: "0.00", over_cap_hours: "0.00" }

  - name: EU daily - the daily rate is not rounded before multiplying
    grant: { method: eu_daily, entity: DE, funding_rate: 0.7, indirect_rate: 0.25 }
    people: { anna: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 70000, contract_hours: 1720, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-04-01, hours: 8, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-04-02, hours: 8, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-04-03, hours: 8, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-04-04, hours: 8, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-04-05, hours: 8, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-04-06, hours: 8, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-04-07, hours: 8, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-04-08, hours: 8, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-04-09, hours: 8, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-04-10, hours: 8, status: approved, late: false }
    period: 2026-04
    expect:
      direct_eur: "3255.81"       # 80h = 10 d; 10*70000/215 = 3255.8139... -> 3255.81 (rounding the rate first, 325.58*10, gives 3255.80)
      indirect_eur: "813.95"      # 3255.81*0.25 = 813.9525 -> 813.95
      funded_eur: "2848.83"       # (3255.81+813.95)*0.7 = 4069.76*0.7 = 2848.832 -> 2848.83
      ineligible_hours: "0.00"
      contributors: 1
      lines:
        anna: { eligible_hours: "80.00", direct_eur: "3255.81" }

  - name: EU daily - quarter hours convert to fractional days
    grant: { method: eu_daily, entity: DE, funding_rate: 0.7, indirect_rate: 0.25 }
    people: { anna: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 86000, contract_hours: 1720, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-03-10, hours: 7.25, status: approved, late: false }
    period: 2026-03
    expect:
      direct_eur: "362.50"        # rate 86000/215 = 400/day; 7.25/8 = 0.90625 d; *400 = 362.50
      indirect_eur: "90.63"       # 362.50*0.25 = 90.625 -> 90.63
      funded_eur: "317.19"        # (362.50+90.63)*0.7 = 453.13*0.7 = 317.191 -> 317.19
      ineligible_hours: "0.00"
      contributors: 1
      lines:
        anna: { eligible_hours: "7.25", direct_eur: "362.50" }

  - name: EU daily - a person's cost rounds half up at the cent (28.125 to 28.13)
    grant: { method: eu_daily, entity: DE, funding_rate: 0.7, indirect_rate: 0.25 }
    people: { anna: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 64500, contract_hours: 1720, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-03-10, hours: 0.75, status: approved, late: false }
    period: 2026-03
    expect:
      direct_eur: "28.13"         # 0.75/8 = 0.09375 d * 300 = 28.125 -> 28.13 (half-even would give 28.12)
      indirect_eur: "7.03"        # 28.13*0.25 = 7.0325 -> 7.03
      funded_eur: "24.61"         # (28.13+7.03)*0.7 = 35.16*0.7 = 24.612 -> 24.61
      ineligible_hours: "0.00"
      contributors: 1
      lines:
        anna: { eligible_hours: "0.75", direct_eur: "28.13" }

  - name: EU daily - indirect rounds half up (103.125 to 103.13)
    grant: { method: eu_daily, entity: DE, funding_rate: 0.7, indirect_rate: 0.25 }
    people: { anna: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 86000, contract_hours: 1720, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-03-10, hours: 8.25, status: approved, late: false }
    period: 2026-03
    expect:
      direct_eur: "412.50"        # 8.25/8 = 1.03125 d * 400 = 412.50
      indirect_eur: "103.13"      # 412.50*0.25 = 103.125 -> 103.13 (half-even would give 103.12)
      funded_eur: "360.94"        # (412.50+103.13)*0.7 = 515.63*0.7 = 360.941 -> 360.94
      ineligible_hours: "0.00"
      contributors: 1

  - name: EU daily - funded rounds half up (65.625 to 65.63)
    grant: { method: eu_daily, entity: DE, funding_rate: 0.7, indirect_rate: 0.25 }
    people: { anna: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 86000, contract_hours: 1720, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-03-10, hours: 1.5, status: approved, late: false }
    period: 2026-03
    expect:
      direct_eur: "75.00"         # 1.5/8 = 0.1875 d * 400 = 75.00
      indirect_eur: "18.75"       # 75.00*0.25 = 18.75
      funded_eur: "65.63"         # (75.00+18.75)*0.7 = 93.75*0.7 = 65.625 -> 65.63 (half-even or binary float gives 65.62)
      ineligible_hours: "0.00"
      contributors: 1

  - name: direct is the sum of per-person costs, each already rounded
    grant: { method: eu_daily, entity: DE, funding_rate: 0.7, indirect_rate: 0.25 }
    people: { anna: DE, bob: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 64500, contract_hours: 1720, managing_director: false }
      - { person: bob, year: 2026, annual_cost_eur: 64500, contract_hours: 1720, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-03-10, hours: 0.75, status: approved, late: false }
      - { person: bob, grant: this, date: 2026-03-10, hours: 0.75, status: approved, late: false }
    period: 2026-03
    expect:
      direct_eur: "56.26"         # each 0.09375 d * 300 = 28.125 -> 28.13; 28.13+28.13 = 56.26 (rounding the sum would give 56.25)
      indirect_eur: "14.07"       # 56.26*0.25 = 14.065 -> 14.07
      funded_eur: "49.23"         # (56.26+14.07)*0.7 = 70.33*0.7 = 49.231 -> 49.23
      ineligible_hours: "0.00"
      contributors: 2
      lines:
        anna: { eligible_hours: "0.75", direct_eur: "28.13" }
        bob: { eligible_hours: "0.75", direct_eur: "28.13" }

  # ---------------------------------------------------------------- year to date, January, year boundary

  - name: indirect and funded are computed year to date and then differenced
    grant: { method: eu_daily, entity: DE, funding_rate: 0.7, indirect_rate: 0.25 }
    people: { anna: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 86000, contract_hours: 1720, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-01-15, hours: 0.25, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-02-16, hours: 0.25, status: approved, late: false }
    period: 2026-02
    expect:
      # YTD Jan: direct 0.25/8*400 = 12.50; indirect 3.125 -> 3.13; funded (12.50+3.13)*0.7 = 15.63*0.7 = 10.941 -> 10.94
      # YTD Feb: direct 25.00; indirect 6.25; funded (25.00+6.25)*0.7 = 31.25*0.7 = 21.875 -> 21.88
      direct_eur: "12.50"         # 25.00 - 12.50
      indirect_eur: "3.12"        # 6.25 - 3.13 (computing the month alone would give 3.13)
      funded_eur: "10.94"         # 21.88 - 10.94
      ineligible_hours: "0.00"
      contributors: 1
      lines:
        anna: { eligible_hours: "0.25", direct_eur: "12.50" }

  - name: January has no previous month and ignores December of the previous year
    grant: { method: eu_daily, entity: DE, funding_rate: 0.7, indirect_rate: 0.25 }
    people: { anna: DE }
    salaries:
      - { person: anna, year: 2025, annual_cost_eur: 86000, contract_hours: 1720, managing_director: false }
      - { person: anna, year: 2026, annual_cost_eur: 107500, contract_hours: 1720, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2025-12-15, hours: 8, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-01-12, hours: 8, status: approved, late: false }
    period: 2026-01
    expect:
      direct_eur: "500.00"        # YTD Jan 2026 only: 1 d * 107500/215 (= 500) = 500.00; nothing subtracted
      indirect_eur: "125.00"      # 500.00*0.25
      funded_eur: "437.50"        # (500.00+125.00)*0.7 = 437.50
      ineligible_hours: "0.00"
      contributors: 1
      lines:
        anna: { eligible_hours: "8.00", direct_eur: "500.00" }

  - name: December uses that year's personnel cost and its own year to date
    grant: { method: eu_daily, entity: DE, funding_rate: 0.7, indirect_rate: 0.25 }
    people: { anna: DE }
    salaries:
      - { person: anna, year: 2025, annual_cost_eur: 86000, contract_hours: 1720, managing_director: false }
      - { person: anna, year: 2026, annual_cost_eur: 107500, contract_hours: 1720, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2025-12-15, hours: 8, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-01-12, hours: 8, status: approved, late: false }
    period: 2025-12
    expect:
      direct_eur: "400.00"        # YTD Dec 2025 = 1 d * 86000/215 (= 400) = 400.00; YTD Nov 2025 = 0
      indirect_eur: "100.00"      # 400.00*0.25
      funded_eur: "350.00"        # 500.00*0.7
      ineligible_hours: "0.00"
      contributors: 1

  # ---------------------------------------------------------------- who and what counts

  - name: late approved entries are shown but not charged
    grant: { method: eu_daily, entity: DE, funding_rate: 0.7, indirect_rate: 0.25 }
    people: { anna: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 86000, contract_hours: 1720, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-03-10, hours: 8, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-03-11, hours: 4, status: approved, late: true }
    period: 2026-03
    expect:
      direct_eur: "400.00"        # only the 8h on time: 1 d * 400
      indirect_eur: "100.00"      # 400*0.25
      funded_eur: "350.00"        # 500*0.7
      ineligible_hours: "4.00"    # late 4 + over-cap 0 + other-entity 0
      contributors: 1
      lines:
        anna: { eligible_hours: "8.00", direct_eur: "400.00", late_hours: "4.00", other_entity_hours: "0.00", over_cap_hours: "0.00" }

  - name: draft, submitted and returned hours do not count, and need no personnel cost record
    grant: { method: eu_daily, entity: DE, funding_rate: 0.7, indirect_rate: 0.25 }
    people: { anna: DE, dora: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 86000, contract_hours: 1720, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-03-10, hours: 8, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-03-11, hours: 2, status: draft, late: false }
      - { person: anna, grant: this, date: 2026-03-12, hours: 3, status: submitted, late: false }
      - { person: anna, grant: this, date: 2026-03-13, hours: 1, status: returned, late: false }
      - { person: dora, grant: this, date: 2026-03-10, hours: 8, status: submitted, late: false }
    period: 2026-03
    expect:
      direct_eur: "400.00"        # only anna's 8h approved: 1 d * 400; dora has no approved hours, so no record needed
      indirect_eur: "100.00"
      funded_eur: "350.00"
      ineligible_hours: "0.00"    # unapproved hours are not "ineligible", they simply do not count
      contributors: 1
      lines:
        anna: { eligible_hours: "8.00", direct_eur: "400.00" }

  - name: employees of another entity are listed as other-entity hours, not charged, no record needed
    grant: { method: eu_daily, entity: DE, funding_rate: 0.7, indirect_rate: 0.25 }
    people: { anna: DE, bob: US, carl: US }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 86000, contract_hours: 1720, managing_director: false }
      - { person: bob, year: 2026, annual_cost_eur: 104000, contract_hours: 2080, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-03-10, hours: 8, status: approved, late: false }
      - { person: bob, grant: this, date: 2026-03-10, hours: 8, status: approved, late: false }
      - { person: carl, grant: this, date: 2026-03-11, hours: 6, status: approved, late: false }
    period: 2026-03
    expect:
      direct_eur: "400.00"        # anna only: 1 d * 400
      indirect_eur: "100.00"
      funded_eur: "350.00"
      ineligible_hours: "14.00"   # other-entity 8 (bob) + 6 (carl)
      contributors: 1
      lines:
        anna: { eligible_hours: "8.00", direct_eur: "400.00", other_entity_hours: "0.00" }
        bob: { eligible_hours: "0.00", direct_eur: "0.00", other_entity_hours: "8.00" }
        carl: { eligible_hours: "0.00", direct_eur: "0.00", other_entity_hours: "6.00" }

  - name: contributors counts only people with eligible hours in the month
    grant: { method: eu_daily, entity: DE, funding_rate: 0.7, indirect_rate: 0.25 }
    people: { anna: DE, bob: DE, carl: DE, dora: DE, erik: US, fay: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 86000, contract_hours: 1720, managing_director: false }
      - { person: bob, year: 2026, annual_cost_eur: 86000, contract_hours: 1720, managing_director: false }
      - { person: carl, year: 2026, annual_cost_eur: 86000, contract_hours: 1720, managing_director: false }
      - { person: dora, year: 2026, annual_cost_eur: 86000, contract_hours: 1720, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-05-12, hours: 8, status: approved, late: false }
      - { person: bob, grant: this, date: 2026-05-12, hours: 4, status: approved, late: false }
      - { person: carl, grant: this, date: 2026-05-13, hours: 2, status: approved, late: false }
      - { person: dora, grant: this, date: 2026-05-13, hours: 5, status: approved, late: true }
      - { person: erik, grant: this, date: 2026-05-14, hours: 3, status: approved, late: false }
      - { person: fay, grant: this, date: 2026-05-14, hours: 6, status: draft, late: false }
    period: 2026-05
    expect:
      direct_eur: "700.00"        # 50 EUR/h: anna 8h 400.00 + bob 4h 200.00 + carl 2h 100.00
      indirect_eur: "175.00"      # 700*0.25
      funded_eur: "612.50"        # 875*0.7
      ineligible_hours: "8.00"    # late 5 (dora) + other-entity 3 (erik)
      contributors: 3             # anna, bob, carl; not dora (late only), erik (other entity), fay (draft)
      lines:
        dora: { eligible_hours: "0.00", late_hours: "5.00", direct_eur: "0.00" }
        erik: { eligible_hours: "0.00", other_entity_hours: "3.00", direct_eur: "0.00" }

  # ---------------------------------------------------------------- missing personnel cost record

  - name: refuses when someone with approved hours has no personnel cost record (EU)
    grant: { method: eu_daily, entity: DE, funding_rate: 0.7, indirect_rate: 0.25 }
    people: { anna: DE }
    salaries: []
    entries:
      - { person: anna, grant: this, date: 2026-03-10, hours: 8, status: approved, late: false }
    period: 2026-03
    expect_error: missing_personnel_cost

  - name: refuses when the only personnel cost record is for another year
    grant: { method: eu_daily, entity: DE, funding_rate: 0.7, indirect_rate: 0.25 }
    people: { anna: DE }
    salaries:
      - { person: anna, year: 2025, annual_cost_eur: 86000, contract_hours: 1720, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-03-10, hours: 8, status: approved, late: false }
    period: 2026-03
    expect_error: missing_personnel_cost

  - name: refuses when someone with approved hours has no personnel cost record (DE hourly)
    grant: { method: de_hourly, entity: DE, funding_rate: 0.5, indirect_rate: 0.2 }
    people: { anna: DE, bob: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 60000, contract_hours: 1600, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-03-10, hours: 8, status: approved, late: false }
      - { person: bob, grant: this, date: 2026-03-10, hours: 2, status: approved, late: false }
    period: 2026-03
    expect_error: missing_personnel_cost

  - name: refuses when someone's approved hours earlier in the year have no record
    grant: { method: eu_daily, entity: DE, funding_rate: 0.7, indirect_rate: 0.25 }
    people: { anna: DE, bob: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 86000, contract_hours: 1720, managing_director: false }
    entries:
      - { person: bob, grant: this, date: 2026-01-20, hours: 4, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-02-10, hours: 8, status: approved, late: false }
    period: 2026-02
    # February is the YTD figure at the end of February minus the end of January; both need bob's cost.
    expect_error: missing_personnel_cost

  - name: no refusal when the person without a record has approved hours only on another grant
    grant: { method: eu_daily, entity: DE, funding_rate: 0.7, indirect_rate: 0.25 }
    other_grants:
      - { id: g2, method: de_hourly, entity: DE }
    people: { anna: DE, bob: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 86000, contract_hours: 1720, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-03-10, hours: 8, status: approved, late: false }
      - { person: bob, grant: g2, date: 2026-03-10, hours: 8, status: approved, late: false }
    period: 2026-03
    expect:
      direct_eur: "400.00"        # anna 1 d * 400
      indirect_eur: "100.00"
      funded_eur: "350.00"
      ineligible_hours: "0.00"
      contributors: 1

  # ---------------------------------------------------------------- de_hourly

  - name: DE hourly - contract hours are used when actual hours are fewer
    grant: { method: de_hourly, entity: DE, funding_rate: 0.5, indirect_rate: 0.2 }
    people: { anna: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 60000, contract_hours: 1600, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-03-10, hours: 6, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-03-11, hours: 4, status: approved, late: false }
    period: 2026-03
    expect:
      direct_eur: "375.00"        # actual 10 < contract 1600; rate 60000/1600 = 37.50; 10*37.50 = 375.00
      indirect_eur: "75.00"       # 375*0.2
      funded_eur: "225.00"        # (375+75)*0.5
      ineligible_hours: "0.00"
      contributors: 1
      lines:
        anna: { eligible_hours: "10.00", direct_eur: "375.00" }

  - name: DE hourly - actual hours above contract lower the rate
    grant: { method: de_hourly, entity: DE, funding_rate: 0.5, indirect_rate: 0.2 }
    people: { anna: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 5000, contract_hours: 100, managing_director: false }
    entries:
      - { person: anna, grant: null, date: 2026-01-05, hours: 10, status: draft, late: false }
      - { person: anna, grant: null, date: 2026-01-06, hours: 10, status: draft, late: false }
      - { person: anna, grant: null, date: 2026-01-07, hours: 10, status: draft, late: false }
      - { person: anna, grant: null, date: 2026-01-08, hours: 10, status: draft, late: false }
      - { person: anna, grant: null, date: 2026-01-09, hours: 10, status: draft, late: false }
      - { person: anna, grant: null, date: 2026-01-10, hours: 10, status: draft, late: false }
      - { person: anna, grant: null, date: 2026-01-11, hours: 10, status: draft, late: false }
      - { person: anna, grant: null, date: 2026-01-12, hours: 10, status: draft, late: false }
      - { person: anna, grant: this, date: 2026-02-02, hours: 10, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-02-03, hours: 10, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-02-04, hours: 10, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-02-05, hours: 10, status: approved, late: false }
    period: 2026-02
    expect:
      # YTD Jan: no grant hours -> 0. YTD Feb: actual 80+40 = 120 > 100; rate 5000/120 = 41.666...
      direct_eur: "1666.67"       # 40*5000/120 = 1666.666... -> 1666.67 (rounding the rate first, 41.67*40, gives 1666.80)
      indirect_eur: "333.33"      # 1666.67*0.2 = 333.334 -> 333.33
      funded_eur: "1000.00"       # (1666.67+333.33)*0.5 = 2000.00*0.5
      ineligible_hours: "0.00"
      contributors: 1
      lines:
        anna: { eligible_hours: "40.00", direct_eur: "1666.67" }

