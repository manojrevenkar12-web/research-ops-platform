# Blind held-out set 2 for the research-ops platform.
# Written only from heldout/WRITING_CASES.md, docs/GRANT_RULES.md, config/grants.yaml, docs/ACCESS.md,
# config/access.yaml and docs/FIXTURE.md. Every money figure was computed by hand from GRANT_RULES.md; the
# arithmetic is in the comment next to it. Day-by-day entry lists (the 215-day cap cases) are one entry per
# calendar day, never more than 10 hours a day per person.
#
# Conventions used throughout the cost cases:
#   eu_daily  daily rate = annual_cost_eur / 215; days = hours / 8; cost = round_half_up(days * rate, 2)
#   de_hourly hourly rate = annual_cost_eur / max(contract_hours, actual YTD hours, any grant/status except returned)
#             managing director: rate = min(rate, 75.00); cost = round_half_up(hours * rate, 2)
#   month figure = YTD(end of month) - YTD(end of previous month); January has no previous month.
#   indirect = round_half_up(direct * indirect_rate); funded = round_half_up((direct + indirect) * funding_rate),
#   both on YTD totals, then differenced.
#   Every grant is assumed to run over all dates its entries use (cases have no grant dates).

cost_cases:

  # ---------------------------------------------------------------- eu_daily basics
  - name: eu_daily one person, two entries, funded rounds half up
    grant: { method: eu_daily, entity: DE, funding_rate: 0.7, indirect_rate: 0.25 }
    people: { anna: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 86000, contract_hours: 1720, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-03-10, hours: 7.5, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-03-11, hours: 6, status: approved, late: false }
    period: 2026-03
    expect:
      direct_eur: "675.00"        # rate 86000/215 = 400.00/day; 13.5 h / 8 = 1.6875 days; 1.6875 * 400 = 675.00
      indirect_eur: "168.75"      # 675.00 * 0.25 = 168.75
      funded_eur: "590.63"        # (675.00 + 168.75) * 0.7 = 843.75 * 0.7 = 590.625 -> half up 590.63
      ineligible_hours: "0.00"
      contributors: 1
      lines:
        anna: { eligible_hours: "13.50", direct_eur: "675.00", late_hours: "0.00", other_entity_hours: "0.00", over_cap_hours: "0.00" }

  - name: eu_daily daily rate is not rounded before multiplying
    grant: { method: eu_daily, entity: DE, funding_rate: 0.7, indirect_rate: 0.25 }
    people: { anna: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 100000, contract_hours: 1720, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-04-01, hours: 8, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-04-02, hours: 8, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-04-03, hours: 8, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-04-06, hours: 8, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-04-07, hours: 8, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-04-08, hours: 8, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-04-09, hours: 8, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-04-10, hours: 8, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-04-13, hours: 8, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-04-14, hours: 8, status: approved, late: false }
    period: 2026-04
    expect:
      direct_eur: "4651.16"       # rate 100000/215 = 465.1162790...; 80 h = 10 days; 4651.162790 -> 4651.16 (a rate rounded first, 465.12, would give 4651.20)
      indirect_eur: "1162.79"     # 4651.16 * 0.25 = 1162.79
      funded_eur: "4069.77"       # (4651.16 + 1162.79) * 0.7 = 5813.95 * 0.7 = 4069.765 -> 4069.77
      contributors: 1

  - name: eu_daily converts at 8 hours a day and ignores contract and actual hours
    grant: { method: eu_daily, entity: DE, funding_rate: 0.7, indirect_rate: 0.25 }
    people: { anna: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 86000, contract_hours: 40, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-05-04, hours: 10, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-05-05, hours: 10, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-05-06, hours: 10, status: approved, late: false }
      - { person: anna, grant: null, date: 2026-05-07, hours: 10, status: draft, late: false }
    period: 2026-05
    expect:
      direct_eur: "1500.00"       # 30 h / 8 = 3.75 days * (86000/215 = 400) = 1500.00 (contract 40 h is irrelevant for eu_daily)
      indirect_eur: "375.00"      # 1500.00 * 0.25
      funded_eur: "1312.50"       # 1875.00 * 0.7 = 1312.50
      contributors: 1
      lines:
        anna: { eligible_hours: "30.00", direct_eur: "1500.00" }

  - name: eu_daily a managing director is not capped at 75 EUR per hour
    grant: { method: eu_daily, entity: DE, funding_rate: 0.7, indirect_rate: 0.25 }
    people: { anna: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 172000, contract_hours: 1720, managing_director: true }
    entries:
      - { person: anna, grant: this, date: 2026-03-02, hours: 8, status: approved, late: false }
    period: 2026-03
    expect:
      direct_eur: "800.00"        # 172000/215 = 800.00/day = 100/h; the 75 EUR/h cap is a de_hourly rule (8 h at 75 would be 600.00)
      indirect_eur: "200.00"      # 800.00 * 0.25
      funded_eur: "700.00"        # 1000.00 * 0.7
      contributors: 1

  - name: eu_daily people's lines are rounded before they are summed
    grant: { method: eu_daily, entity: DE, funding_rate: 0.7, indirect_rate: 0.25 }
    people: { anna: DE, bob: DE, carl: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 100000, contract_hours: 1720, managing_director: false }
      - { person: bob, year: 2026, annual_cost_eur: 100000, contract_hours: 1720, managing_director: false }
      - { person: carl, year: 2026, annual_cost_eur: 100000, contract_hours: 1720, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-06-01, hours: 0.25, status: approved, late: false }
      - { person: bob, grant: this, date: 2026-06-01, hours: 0.25, status: approved, late: false }
      - { person: carl, grant: this, date: 2026-06-01, hours: 0.25, status: approved, late: false }
    period: 2026-06
    expect:
      direct_eur: "43.59"         # each: 0.25/8 = 0.03125 days * 465.1162790 = 14.534883... -> 14.53; 3 * 14.53 = 43.59 (unrounded sum 43.6046 would give 43.60)
      indirect_eur: "10.90"       # 43.59 * 0.25 = 10.8975 -> 10.90
      funded_eur: "38.14"         # (43.59 + 10.90) * 0.7 = 54.49 * 0.7 = 38.143 -> 38.14
      contributors: 3
      lines:
        anna: { direct_eur: "14.53" }
        bob: { direct_eur: "14.53" }
        carl: { direct_eur: "14.53" }

  - name: eu_daily no indirect costs and full funding
    grant: { method: eu_daily, entity: DE, funding_rate: 1.0, indirect_rate: 0.0 }
    people: { anna: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 86000, contract_hours: 1720, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-07-01, hours: 8, status: approved, late: false }
    period: 2026-07
    expect:
      direct_eur: "400.00"        # 1 day * 400.00
      indirect_eur: "0.00"        # 400.00 * 0.0
      funded_eur: "400.00"        # (400.00 + 0.00) * 1.0
      contributors: 1

  # ---------------------------------------------------------------- de_hourly basics
  - name: de_hourly one person with quarter hours
    grant: { method: de_hourly, entity: DE, funding_rate: 0.5, indirect_rate: 0.8 }
    people: { anna: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 86000, contract_hours: 1720, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-05-04, hours: 8, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-05-05, hours: 4.25, status: approved, late: false }
    period: 2026-05
    expect:
      direct_eur: "612.50"        # rate 86000 / max(1720, 12.25) = 50.00; 12.25 * 50 = 612.50
      indirect_eur: "490.00"      # 612.50 * 0.8 = 490.00
      funded_eur: "551.25"        # (612.50 + 490.00) * 0.5 = 551.25
      ineligible_hours: "0.00"
      contributors: 1
      lines:
        anna: { eligible_hours: "12.25", direct_eur: "612.50" }

  - name: de_hourly hourly rate is not rounded before multiplying
    grant: { method: de_hourly, entity: DE, funding_rate: 0.5, indirect_rate: 0.8 }
    people: { anna: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 98000, contract_hours: 1720, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-06-01, hours: 10, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-06-02, hours: 10, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-06-03, hours: 10, status: approved, late: false }
    period: 2026-06
    expect:
      direct_eur: "1709.30"       # 98000/1720 = 56.9767441...; 30 * 56.9767441 = 1709.302325 -> 1709.30 (rate rounded first, 56.98, would give 1709.40)
      indirect_eur: "1367.44"     # 1709.30 * 0.8 = 1367.44
      funded_eur: "1538.37"       # (1709.30 + 1367.44) * 0.5 = 3076.74 * 0.5 = 1538.37
      contributors: 1

  - name: de_hourly person line rounds half up
    grant: { method: de_hourly, entity: DE, funding_rate: 0.5, indirect_rate: 0.25 }
    people: { anna: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 100008, contract_hours: 1600, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-02-03, hours: 1, status: approved, late: false }
    period: 2026-02
    expect:
      direct_eur: "62.51"         # 100008/1600 = 62.505 exactly; 1 h -> 62.505 -> half up 62.51 (half even would be 62.50)
      indirect_eur: "15.63"       # 62.51 * 0.25 = 15.6275 -> 15.63
      funded_eur: "39.07"         # (62.51 + 15.63) * 0.5 = 78.14 * 0.5 = 39.07
      contributors: 1

  - name: de_hourly indirect and funded round half up
    grant: { method: de_hourly, entity: DE, funding_rate: 0.5, indirect_rate: 0.25 }
    people: { anna: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 160016, contract_hours: 1600, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-02-03, hours: 10, status: approved, late: false }
    period: 2026-02
    expect:
      direct_eur: "1000.10"       # 160016/1600 = 100.01; 10 * 100.01 = 1000.10
      indirect_eur: "250.03"      # 1000.10 * 0.25 = 250.025 -> half up 250.03 (half even 250.02)
      funded_eur: "625.07"        # (1000.10 + 250.03) * 0.5 = 1250.13 * 0.5 = 625.065 -> half up 625.07 (half even 625.06)
      contributors: 1

  - name: de_hourly two people at different rates
    grant: { method: de_hourly, entity: DE, funding_rate: 0.5, indirect_rate: 0.8 }
    people: { anna: DE, bob: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 86000, contract_hours: 1720, managing_director: false }
      - { person: bob, year: 2026, annual_cost_eur: 98000, contract_hours: 1720, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-03-02, hours: 8, status: approved, late: false }
      - { person: bob, grant: this, date: 2026-03-02, hours: 4, status: approved, late: false }
    period: 2026-03
    expect:
      direct_eur: "627.91"        # anna 8 * 50.00 = 400.00; bob 4 * 56.9767441 = 227.906976 -> 227.91; 400.00 + 227.91 = 627.91
      indirect_eur: "502.33"      # 627.91 * 0.8 = 502.328 -> 502.33
      funded_eur: "565.12"        # (627.91 + 502.33) * 0.5 = 1130.24 * 0.5 = 565.12
      contributors: 2
      lines:
        anna: { eligible_hours: "8.00", direct_eur: "400.00" }
        bob: { eligible_hours: "4.00", direct_eur: "227.91" }

  - name: de_hourly three quarter-hour lines are rounded before they are summed
    grant: { method: de_hourly, entity: DE, funding_rate: 0.5, indirect_rate: 0.8 }
    people: { anna: DE, bob: DE, carl: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 98000, contract_hours: 1720, managing_director: false }
      - { person: bob, year: 2026, annual_cost_eur: 98000, contract_hours: 1720, managing_director: false }
      - { person: carl, year: 2026, annual_cost_eur: 98000, contract_hours: 1720, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-03-03, hours: 0.25, status: approved, late: false }
      - { person: bob, grant: this, date: 2026-03-03, hours: 0.25, status: approved, late: false }
      - { person: carl, grant: this, date: 2026-03-03, hours: 0.25, status: approved, late: false }
    period: 2026-03
    expect:
      direct_eur: "42.72"         # each 0.25 * 56.9767441 = 14.244186 -> 14.24; 3 * 14.24 = 42.72 (unrounded sum 42.7326 would give 42.73)
      indirect_eur: "34.18"       # 42.72 * 0.8 = 34.176 -> 34.18
      funded_eur: "38.45"         # (42.72 + 34.18) * 0.5 = 76.90 * 0.5 = 38.45
      contributors: 3

  # ---------------------------------------------------------------- managing director
  - name: de_hourly managing director capped at 75 EUR per hour
    grant: { method: de_hourly, entity: DE, funding_rate: 0.5, indirect_rate: 0.8 }
    people: { gerd: DE }
    salaries:
      - { person: gerd, year: 2026, annual_cost_eur: 190000, contract_hours: 1720, managing_director: true }
    entries:
      - { person: gerd, grant: this, date: 2026-03-04, hours: 8, status: approved, late: false }
    period: 2026-03
    expect:
      direct_eur: "600.00"        # 190000/1720 = 110.4651... > 75.00 -> 75.00; 8 * 75.00 = 600.00
      indirect_eur: "480.00"      # 600.00 * 0.8
      funded_eur: "540.00"        # (600.00 + 480.00) * 0.5
      contributors: 1
      lines:
        gerd: { eligible_hours: "8.00", direct_eur: "600.00" }

  - name: de_hourly managing director below the cap keeps the own rate
    grant: { method: de_hourly, entity: DE, funding_rate: 0.5, indirect_rate: 0.8 }
    people: { gerd: DE }
    salaries:
      - { person: gerd, year: 2026, annual_cost_eur: 103200, contract_hours: 1720, managing_director: true }
    entries:
      - { person: gerd, grant: this, date: 2026-03-04, hours: 8, status: approved, late: false }
    period: 2026-03
    expect:
      direct_eur: "480.00"        # 103200/1720 = 60.00 < 75.00; 8 * 60.00 = 480.00
      indirect_eur: "384.00"      # 480.00 * 0.8
      funded_eur: "432.00"        # (480.00 + 384.00) * 0.5
      contributors: 1

  - name: de_hourly managing director cap applies to the rate after dividing by actual hours
    grant: { method: de_hourly, entity: DE, funding_rate: 0.5, indirect_rate: 0.2 }
    people: { gerd: DE }
    salaries:
      - { person: gerd, year: 2026, annual_cost_eur: 6000, contract_hours: 40, managing_director: true }
    entries:
      - { person: gerd, grant: this, date: 2026-02-02, hours: 10, status: approved, late: false }
      - { person: gerd, grant: this, date: 2026-02-03, hours: 10, status: approved, late: false }
      - { person: gerd, grant: this, date: 2026-02-04, hours: 10, status: approved, late: false }
      - { person: gerd, grant: null, date: 2026-02-05, hours: 10, status: draft, late: false }
      - { person: gerd, grant: null, date: 2026-02-06, hours: 10, status: draft, late: false }
      - { person: gerd, grant: null, date: 2026-02-09, hours: 10, status: draft, late: false }
      - { person: gerd, grant: null, date: 2026-02-10, hours: 10, status: draft, late: false }
      - { person: gerd, grant: null, date: 2026-02-11, hours: 10, status: draft, late: false }
      - { person: gerd, grant: null, date: 2026-02-12, hours: 10, status: draft, late: false }
      - { person: gerd, grant: null, date: 2026-02-13, hours: 10, status: draft, late: false }
    period: 2026-02
    expect:
      direct_eur: "1800.00"       # actual 100 h > contract 40 -> 6000/100 = 60.00 (< 75, cap not reached); 30 * 60.00 = 1800.00 (6000/40 = 150 capped to 75 would give 2250.00)
      indirect_eur: "360.00"      # 1800.00 * 0.2
      funded_eur: "1080.00"       # 2160.00 * 0.5
      contributors: 1

  # ---------------------------------------------------------------- contract vs actual hours
  - name: de_hourly actual hours above contract include draft hours on no grant
    grant: { method: de_hourly, entity: DE, funding_rate: 0.5, indirect_rate: 0.2 }
    people: { anna: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 4000, contract_hours: 40, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-02-02, hours: 10, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-02-03, hours: 10, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-02-04, hours: 10, status: approved, late: false }
      - { person: anna, grant: null, date: 2026-02-05, hours: 10, status: draft, late: false }
      - { person: anna, grant: null, date: 2026-02-06, hours: 10, status: draft, late: false }
    period: 2026-02
    expect:
      direct_eur: "2400.00"       # actual 30 + 20 = 50 > 40 -> 4000/50 = 80.00; 30 * 80.00 = 2400.00
      indirect_eur: "480.00"      # 2400.00 * 0.2
      funded_eur: "1440.00"       # 2880.00 * 0.5
      ineligible_hours: "0.00"
      contributors: 1
      lines:
        anna: { eligible_hours: "30.00", direct_eur: "2400.00" }

  - name: de_hourly returned hours do not count as actual hours
    grant: { method: de_hourly, entity: DE, funding_rate: 0.5, indirect_rate: 0.2 }
    people: { anna: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 4000, contract_hours: 40, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-02-02, hours: 10, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-02-03, hours: 10, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-02-04, hours: 10, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-02-05, hours: 10, status: returned, late: false }
      - { person: anna, grant: this, date: 2026-02-06, hours: 10, status: returned, late: false }
    period: 2026-02
    expect:
      direct_eur: "3000.00"       # actual 30 (returned 20 excluded) < 40 -> 4000/40 = 100.00; 30 * 100.00 = 3000.00
      indirect_eur: "600.00"      # 3000.00 * 0.2
      funded_eur: "1800.00"       # 3600.00 * 0.5
      ineligible_hours: "0.00"    # returned hours are not approved, so neither eligible nor ineligible
      contributors: 1

  - name: de_hourly actual hours include submitted hours on another grant and late hours, late not charged
    grant: { method: de_hourly, entity: DE, funding_rate: 0.5, indirect_rate: 0.2 }
    other_grants:
      - { id: g2, method: de_hourly, entity: DE }
    people: { anna: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 4000, contract_hours: 40, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-02-02, hours: 10, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-02-03, hours: 10, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-02-04, hours: 10, status: approved, late: true }
      - { person: anna, grant: g2, date: 2026-02-05, hours: 10, status: submitted, late: false }
      - { person: anna, grant: g2, date: 2026-02-06, hours: 10, status: submitted, late: false }
    period: 2026-02
    expect:
      direct_eur: "1600.00"       # actual 10+10+10(late)+20(g2 submitted) = 50 -> 4000/50 = 80.00; eligible 20 (late 10 not charged) * 80 = 1600.00
      indirect_eur: "320.00"      # 1600.00 * 0.2
      funded_eur: "960.00"        # 1920.00 * 0.5
      ineligible_hours: "10.00"   # late 10 + over-cap 0 + other-entity 0
      contributors: 1
      lines:
        anna: { eligible_hours: "20.00", late_hours: "10.00", direct_eur: "1600.00" }

  - name: de_hourly actual hours stop at the end of the month computed
    grant: { method: de_hourly, entity: DE, funding_rate: 0.5, indirect_rate: 0.2 }
    people: { anna: DE }
    salaries:
      - { person: anna, year: 2026, annual_cost_eur: 4000, contract_hours: 40, managing_director: false }
    entries:
      - { person: anna, grant: this, date: 2026-02-02, hours: 10, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-02-03, hours: 10, status: approved, late: false }
      - { person: anna, grant: this, date: 2026-02-04, hours: 10, status: approved, late: false }
      - { person: anna, grant: null, date: 2026-03-02, hours: 10, status: draft, late: false }
      - { person: anna, grant: null, date: 2026-03-03, hours: 10, status: draft, late: false }
      - { person: anna, grant: null, date: 2026-03-04, hours: 10, status: draft, late: false }
      - { person: anna, grant: null, date: 2026-03-05, hours: 10, status: draft, late: false }
      - { person: anna, grant: null, date: 2026-03-06, hours: 10, status: draft, late: false }
    period: 2026-02
    expect:
      direct_eur: "3000.00"       # actual to end of February = 30 < 40 -> 100.00; March hours ignored; 30 * 100.00 = 3000.00
      indirect_eur: "600.00"      # 3000.00 * 0.2
      funded_eur: "1800.00"       # 3600.00 * 0.5
      contributors: 1

  - name: de_hourly actual hours of the previous year do not count in January
    grant: { method: de_hourly, entity: DE, funding_rate: 0.5, indirect_rate: 0.2 }
    people: { anna: DE }
    salaries:
      - { person: anna, year: 2025, annual_cost_eur: 4000, contract_hours: 40, managing_director: false }
      - { person: anna, year: 2026, annual_cost_eur: 4000, contract_hours: 40, managing_director: false }
    entries:
