# Access cases. Each runs alone on the original fixture (docs/FIXTURE.md) inside a rolled-back transaction.
# Key ids: grant EU-LPI-26 = ...600000001 (eu_daily, lead ana; September 2026 closed, October open),
# grant DE-TGT-26 = ...600000002 (de_hourly, starts 2026-04-01, lead ben; October open).
# The run date is 3 November 2026 or later, so every October 2026 date is in the past.

access_cases:

  # ---------------------------------------------------------------- people
  - name: staff see people
    as: hana
    table: people
    op: select
    row: { id: "00000000-0000-4000-8000-000100000001" }
    expect: visible

  - name: a Platform-only service principal does not see people
    as: dispatcher
    table: people
    op: select
    row: { id: "00000000-0000-4000-8000-000100000001" }
    expect: hidden

  - name: the cost-snapshot service principal sees people (it holds Staff)
    as: cost-snapshot
    table: people
    op: select
    row: { id: "00000000-0000-4000-8000-000100000008" }
    expect: visible

  - name: nobody adds people through the app, not even PeopleOps
    as: eva
    table: people
    op: insert
    values: { id: "00000000-0000-4000-8000-0001000000b1", entra_oid: "00000000-0000-4000-8000-0000000000b1", display_name: New Hire, email: new.hire@example.com, entity: DE, team: People, active: true }
    expect: denied

  - name: nobody changes people through the app
    as: eva
    table: people
    op: update
    row: { id: "00000000-0000-4000-8000-000100000008" }
    change: { team: Finance }
    expect: denied

  - name: nobody deletes people through the app
    as: dan
    table: people
    op: delete
    row: { id: "00000000-0000-4000-8000-00010000000a" }
    expect: denied

  # ---------------------------------------------------------------- campaigns
  - name: a cleared scientist sees a restricted campaign
    as: ana
    table: campaigns
    op: select
    row: { code: PHX-26-R1 }
    expect: visible

  - name: a cleared scientist of another entity sees a restricted campaign
    as: cleo
    table: campaigns
    op: select
    row: { code: PHX-25-R3 }
    expect: visible

  - name: an uncleared scientist does not see a restricted campaign they are not leading
    as: jan
    table: campaigns
    op: select
    row: { code: PHX-26-R1 }
    expect: hidden

  - name: an uncleared lead does not see their own restricted campaign
    as: ben
    table: campaigns
    op: select
    row: { code: PHX-25-R3 }
    expect: hidden

  - name: a scientist sees an internal campaign of another entity
    as: jan
    table: campaigns
    op: select
